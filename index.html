<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather_website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

    <div class="container">

        <div class="main">
            <div class="input">
                <label for="entrada"><i class="fa-solid fa-location-dot"></i></label>
                <input id="entrada" type="text"  placeholder="Digite a cidade " required>
                <button id="btn-buscar" onclick="buscar()"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>

            <div class="centre">
                <img class="iconURL" src="">
                <h2 class="temp"><span id="temp-grau">--</span>°C</h2>
                <h2 class="sky"></h2>
                <div class="line"></div>
                
            </div>
            <div class="down">
                <h2 class="date"> </h2>
                <h2 class="time">  </h2>
                <h2 class="country"></h2>

                <h1 class="city">--------</h1>

            </div>

        </div>

        <div class="extra-info">
            <div class="top">
                <p>Hoje</p>
                
            </div>
            <div class="other-info">
                <div class="items veloc">
                    <p>Wind</p>
                    <h2> <span id="veloc">--</span> m/s</h2>
                    <p> East </p>

                </div>
                <div class="items hum">
                    <p>Humadity</p>
                    <h2><span id="humad">--</span>%</h2>
                </div>
                <div class="items sens">
                    <p>Real Feel</p>
                    <h2><span id="tem-fell">--</span>°C</h2>

                </div>
                <div class="items index">
                    <p>UV Index</p>
                    <h2 class="index-text">--</h2>
                    <p> Moderate </p>
                </div>
                <div class="items pres">
                    <p> Pressure </p>
                    <h2><span id="pressure">--</span> mb</h2>
                </div>
                <div class="items rain">
                    <p> Change of rain </p>
                    <h2 class="rain-text">--%</h2>
                </div>
                <div class="items TemMax-TemMin">
                    <p> Temperature History </p>
                    <h2> <i class="fa-solid fa-arrow-up-long"></i> <span id="up">--</span>°C</h2>
                    <h2> <i class="fa-solid fa-arrow-down-long"></i> <span id="down">--</span>°C</h2>
                </div>
                <div class="items Sun">
                    <p> ☀️ Sun </p>
                    <h2 id="sunrise"></h2>
                    <h2 id="sunset"></h2>
                </div>
                <div class="items Moon">
                    <p> 🌙 Moon </p>
                    <h2 id="moonrise"></h2>
                    <h2 id="moonset"></h2>
                </div>

            </div>
        </div>


    </div>




    <script src="script.js"></script>
</body>

</html>
