<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather_website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

    <div class="container">

        <div class="main">
            <div class="input">
                <input type="text" placeholder="Digite a cidade " required>
                <button><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>

            <div class="centre">
                <img src="Photo/sol.png" alt="Icon">
                <h2 class="temp"><span>31</span>°C</h2>
                <h2 class="sky"> Mostly Cloudy </h2>
                <div class="line"></div>
                
            </div>
            <div class="down">
                <h2 class="date"> 23-Setembro-2026</h2>
                <h2 class="time"> Quarta-feira, 17:44 PM </h2>
                <h2 class="time-of-day"> Dia</h2>

                <h1 class="city">Luanda</h1>

            </div>

        </div>

        <div class="extra-info">
            <div class="top">
                <p>Hoje</p>
                
            </div>
            <div class="other-info">
                <div class="items veloc">
                    <p>Wind</p>
                    <h2> <span>6</span> km/h</h2>
                    <p> East </p>

                </div>
                <div class="items hum">
                    <p>Humadity</p>
                    <h2><span>69</span>%</h2>
                </div>
                <div class="items sens">
                    <p>Real Feel</p>
                    <h2><span>31</span>°C</h2>

                </div>
                <div class="items index">
                    <p>UV Index</p>
                    <h2>3</h2>
                    <p> Moderate </p>
                </div>
                <div class="items pres">
                    <p> Pressure </p>
                    <h2><span>1000</span> mb</h2>
                </div>
                <div class="items rain">
                    <p> Change of rain </p>
                    <h2><span>70</span>%</h2>
                </div>
                <div class="items TemMax-TemMin">
                    <p> Temperature History </p>
                    <h2> <i class="fa-solid fa-arrow-up-long"></i> <span>31°C</span></h2>
                    <h2> <i class="fa-solid fa-arrow-down-long"></i> <span>31°C</span></h2>
                </div>
                <div class="items Sun">
                    <p> Sun </p>
                    <h2> Rise <span>5:17</span> am</h2>
                    <h2> Rise <span>5:17</span> am</h2>
                </div>
                <div class="items Moon">
                    <p> Moon </p>
                    <h2> Rise <span>5:17</span> am</h2>
                    <h2> Rise <span>5:17</span> am</h2>
                </div>

            </div>
        </div>


    </div>




    <script src="script.js"></script>
</body>

</html>
